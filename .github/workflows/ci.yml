name: CI

# Triggers: every push to master/main and every PR targeting those branches.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-flight runs for the same branch/PR to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Shared defaults ──────────────────────────────────────────────────────────
env:
  # Point to SonarCloud by default; override with a repo secret to use a
  # self-hosted SonarQube instance (e.g. http://your-host:9000).
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

jobs:
  # ── traffic-api (Spring WebFlux + Testcontainers) ──────────────────────────
  test-traffic-api:
    name: traffic-api — Maven + JaCoCo + Sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Sonar needs full history for blame / new-code detection

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Maven wrapper is committed to the repo; no separate install needed.
      # `verify` compiles, runs unit tests, runs integration tests (Testcontainers
      # spins up a real Redis container), and generates JaCoCo XML report.
      - name: Build, test & generate coverage
        working-directory: traffic-api
        run: ./mvnw verify -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: SonarQube analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        working-directory: traffic-api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar -B \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

  # ── traffic-stream-processor (Kafka Streams) ───────────────────────────────
  test-traffic-stream-processor:
    name: traffic-stream-processor — Maven + JaCoCo + Sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, test & generate coverage
        working-directory: traffic-stream-processor
        run: ./mvnw verify -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: SonarQube analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        working-directory: traffic-stream-processor
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar -B \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

  # ── traffic-alert-engine ───────────────────────────────────────────────────
  test-traffic-alert-engine:
    name: traffic-alert-engine — Maven + JaCoCo + Sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, test & generate coverage
        working-directory: traffic-alert-engine
        run: ./mvnw verify -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: SonarQube analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        working-directory: traffic-alert-engine
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar -B \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

  # ── traffic-simulator (Go) ─────────────────────────────────────────────────
  test-traffic-simulator:
    name: traffic-simulator — Go tests + Sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: traffic-simulator/go.mod
          cache-dependency-path: traffic-simulator/go.sum

      - name: Run tests with coverage
        working-directory: traffic-simulator
        run: go test ./... -coverprofile=coverage.out -covermode=atomic -v

      - name: SonarQube analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: traffic-simulator
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  # ── traffic-dashboard (Next.js / Vitest / Playwright) ─────────────────────
  test-traffic-dashboard:
    name: traffic-dashboard — Vitest + Playwright + Sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: traffic-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: traffic-dashboard
        run: npm ci

      # Unit + component tests with LCOV output for SonarQube
      - name: Unit tests with coverage
        working-directory: traffic-dashboard
        run: npm run test:coverage

      # Install only the Chromium browser (saves ~400 MB vs all browsers)
      - name: Install Playwright browsers
        working-directory: traffic-dashboard
        run: npx playwright install --with-deps chromium

      # E2E tests mock all API calls via page.route() — no backend needed.
      # Global setup pre-warms Next.js pages before tests run.
      - name: E2E tests
        working-directory: traffic-dashboard
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: traffic-dashboard/playwright-report/
          retention-days: 7

      - name: SonarQube analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: traffic-dashboard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  # ── traffic-predictor (Python / FastAPI / pytest) ──────────────────────────
  test-traffic-predictor:
    name: traffic-predictor — pytest + Sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: traffic-predictor/requirements.txt

      - name: Install dependencies
        working-directory: traffic-predictor
        run: pip install -r requirements.txt pytest-cov

      # pytest.ini sets asyncio_mode=auto and testpaths=tests
      - name: Run tests with coverage
        working-directory: traffic-predictor
        run: pytest --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing -v

      - name: SonarQube analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: traffic-predictor
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  # ── Quality Gate ────────────────────────────────────────────────────────────
  # Final job that only passes when ALL test jobs succeed. Branch protection
  # rules can require this single job instead of listing every individual job.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs:
      - test-traffic-api
      - test-traffic-stream-processor
      - test-traffic-alert-engine
      - test-traffic-simulator
      - test-traffic-dashboard
      - test-traffic-predictor
    steps:
      - run: echo "All CI jobs passed ✅"
