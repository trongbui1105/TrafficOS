apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "kafka") .) | nindent 4 }}
spec:
  type: ClusterIP
  # A headless service is also created automatically by the StatefulSet serviceName;
  # this named service is used by all clients as a stable DNS entry.
  selector:
    {{- include "trafficOS.selectorLabels" (merge (dict "component" "kafka") .) | nindent 4 }}
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: controller
      port: 9093
      targetPort: 9093
      protocol: TCP
