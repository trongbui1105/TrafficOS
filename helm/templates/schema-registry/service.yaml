apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "schema-registry") .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "trafficOS.selectorLabels" (merge (dict "component" "schema-registry") .) | nindent 4 }}
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
