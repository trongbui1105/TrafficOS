apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "schema-registry") .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "trafficOS.selectorLabels" (merge (dict "component" "schema-registry") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trafficOS.selectorLabels" (merge (dict "component" "schema-registry") .) | nindent 8 }}
    spec:
      initContainers:
        # Wait until the Kafka broker's PLAINTEXT port is accepting connections
        - name: wait-for-kafka
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for kafka:9092..."
              until nc -z kafka 9092; do
                echo "kafka not ready, sleeping 2s"
                sleep 2
              done
              echo "kafka is ready"
      containers:
        - name: schema-registry
          image: "{{ .Values.global.imageRegistry }}{{ .Values.schemaRegistry.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: "schema-registry"
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8082"
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: SCHEMA_REGISTRY_INTER_INSTANCE_PROTOCOL
              value: "http"
          readinessProbe:
            httpGet:
              path: /subjects
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /subjects
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml .Values.schemaRegistry.resources | nindent 12 }}
