apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "clickhouse") .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "trafficOS.selectorLabels" (merge (dict "component" "clickhouse") .) | nindent 4 }}
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
    - name: native
      port: 9000
      targetPort: 9000
      protocol: TCP
