apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "clickhouse") .) | nindent 4 }}
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "trafficOS.selectorLabels" (merge (dict "component" "clickhouse") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trafficOS.selectorLabels" (merge (dict "component" "clickhouse") .) | nindent 8 }}
    spec:
      initContainers:
        # Ensure data directory permissions are correct before ClickHouse starts
        - name: fix-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chown -R 101:101 /var/lib/clickhouse
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
          securityContext:
            runAsUser: 0
      containers:
        - name: clickhouse
          image: "{{ .Values.global.imageRegistry }}{{ .Values.clickhouse.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: native
              containerPort: 9000
              protocol: TCP
          env:
            - name: CLICKHOUSE_DB
              value: "default"
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_PASSWORD
              value: ""
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            # Memory cap — matches ClickHouse max_memory_usage setting
            - name: CLICKHOUSE_MAX_MEMORY_USAGE
              value: {{ .Values.clickhouse.maxMemory | quote }}
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: clickhouse-init
          configMap:
            name: {{ .Release.Name }}-clickhouse-init
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
        namespace: {{ .Values.global.namespace | default "trafficOS" }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage }}
