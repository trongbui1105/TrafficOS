apiVersion: v1
kind: Service
metadata:
  name: traffic-alert-engine
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "traffic-alert-engine") .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "trafficOS.selectorLabels" (merge (dict "component" "traffic-alert-engine") .) | nindent 4 }}
  ports:
    - name: actuator
      port: {{ .Values.trafficAlertEngine.port }}
      targetPort: {{ .Values.trafficAlertEngine.port }}
      protocol: TCP
