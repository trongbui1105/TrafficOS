apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-alert-engine
  labels:
    {{- include "traffic-system.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.trafficAlertEngine.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-alert-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-alert-engine
    spec:
      containers:
        - name: traffic-alert-engine
          image: "{{ .Values.global.imageRegistry }}{{ .Values.trafficAlertEngine.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.trafficAlertEngine.port }}
          env:
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: SCHEMA_REGISTRY_URL
              value: {{ .Values.schemaRegistry.url | quote }}
            - name: CLICKHOUSE_URL
              value: {{ .Values.clickhouse.url | quote }}
            {{- range $k, $v := .Values.trafficAlertEngine.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.trafficAlertEngine.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
