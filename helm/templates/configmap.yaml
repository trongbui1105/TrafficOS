apiVersion: v1
kind: ConfigMap
metadata:
  name: trafficOS-config
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "config") .) | nindent 4 }}
data:
  # Kafka
  KAFKA_BROKER: "kafka:9092"
  KAFKA_BROKERS: "kafka:9092"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # Schema Registry
  SCHEMA_REGISTRY_URL: "http://schema-registry:8082"

  # ClickHouse — JDBC URL used by Java Spring services
  CLICKHOUSE_URL: "jdbc:ch://clickhouse:8123/default?compress=0"
  # Raw host/port used by Python predictor and Go simulator HTTP inserts
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_HTTP_PORT: "8123"
  CLICKHOUSE_DB: "default"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"

  # Internal service URLs
  PREDICTOR_URL: "http://traffic-predictor:8000"
