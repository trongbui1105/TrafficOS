apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-stream-processor
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "traffic-stream-processor") .) | nindent 4 }}
spec:
  replicas: {{ .Values.trafficStreamProcessor.replicaCount }}
  selector:
    matchLabels:
      {{- include "trafficOS.selectorLabels" (merge (dict "component" "traffic-stream-processor") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trafficOS.selectorLabels" (merge (dict "component" "traffic-stream-processor") .) | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for kafka:9092..."
              until nc -z kafka 9092; do
                echo "kafka not ready, sleeping 2s"
                sleep 2
              done
              echo "kafka is ready"
        - name: wait-for-schema-registry
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for schema-registry:8082..."
              until nc -z schema-registry 8082; do
                echo "schema-registry not ready, sleeping 2s"
                sleep 2
              done
              echo "schema-registry is ready"
        - name: wait-for-clickhouse
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for clickhouse:8123..."
              until nc -z clickhouse 8123; do
                echo "clickhouse not ready, sleeping 2s"
                sleep 2
              done
              echo "clickhouse is ready"
      containers:
        - name: traffic-stream-processor
          image: "{{ .Values.global.imageRegistry }}{{ .Values.trafficStreamProcessor.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: actuator
              containerPort: {{ .Values.trafficStreamProcessor.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: trafficOS-config
          env:
            - name: JAVA_OPTS
              value: {{ .Values.trafficStreamProcessor.env.JAVA_OPTS | quote }}
            - name: KAFKA_INPUT_TOPIC
              value: {{ .Values.trafficStreamProcessor.env.KAFKA_INPUT_TOPIC | quote }}
            - name: KAFKA_OUTPUT_TOPIC
              value: {{ .Values.trafficStreamProcessor.env.KAFKA_OUTPUT_TOPIC | quote }}
            - name: WINDOW_SIZE_SECONDS
              value: {{ .Values.trafficStreamProcessor.env.WINDOW_SIZE_SECONDS | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.trafficStreamProcessor.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.trafficStreamProcessor.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml .Values.trafficStreamProcessor.resources | nindent 12 }}
