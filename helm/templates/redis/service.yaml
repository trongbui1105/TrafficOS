apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "redis") .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "trafficOS.selectorLabels" (merge (dict "component" "redis") .) | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
