{{- if .Values.trafficApi.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traffic-api
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "traffic-api") .) | nindent 4 }}
  annotations:
    # Allow long-lived WebSocket connections on the /ws/live endpoint
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-set-headers: "trafficOS/websocket-headers"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
spec:
  ingressClassName: {{ .Values.trafficApi.ingress.ingressClassName | default "nginx" }}
  rules:
    - host: {{ .Values.trafficApi.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traffic-api
                port:
                  number: 80
{{- end }}
