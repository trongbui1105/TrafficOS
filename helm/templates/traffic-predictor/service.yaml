apiVersion: v1
kind: Service
metadata:
  name: traffic-predictor
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "traffic-predictor") .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "trafficOS.selectorLabels" (merge (dict "component" "traffic-predictor") .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.trafficPredictor.port }}
      targetPort: {{ .Values.trafficPredictor.port }}
      protocol: TCP
