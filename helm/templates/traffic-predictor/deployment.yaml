apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-predictor
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "traffic-predictor") .) | nindent 4 }}
spec:
  replicas: {{ .Values.trafficPredictor.replicaCount }}
  selector:
    matchLabels:
      {{- include "trafficOS.selectorLabels" (merge (dict "component" "traffic-predictor") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trafficOS.selectorLabels" (merge (dict "component" "traffic-predictor") .) | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for clickhouse:8123..."
              until nc -z clickhouse 8123; do
                echo "clickhouse not ready, sleeping 2s"
                sleep 2
              done
              echo "clickhouse is ready"
        - name: wait-for-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for redis:6379..."
              until nc -z redis 6379; do
                echo "redis not ready, sleeping 2s"
                sleep 2
              done
              echo "redis is ready"
      containers:
        - name: traffic-predictor
          image: "{{ .Values.global.imageRegistry }}{{ .Values.trafficPredictor.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.trafficPredictor.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: trafficOS-config
          env:
            - name: RETRAIN_INTERVAL
              value: {{ .Values.trafficPredictor.retrainInterval | quote }}
            - name: REFRESH_INTERVAL
              value: {{ .Values.trafficPredictor.refreshInterval | quote }}
            - name: PERSIST_INTERVAL
              value: {{ .Values.trafficPredictor.persistInterval | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.trafficPredictor.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.trafficPredictor.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml .Values.trafficPredictor.resources | nindent 12 }}
