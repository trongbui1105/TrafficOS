apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-dashboard
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "traffic-dashboard") .) | nindent 4 }}
spec:
  replicas: {{ .Values.trafficDashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "trafficOS.selectorLabels" (merge (dict "component" "traffic-dashboard") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trafficOS.selectorLabels" (merge (dict "component" "traffic-dashboard") .) | nindent 8 }}
    spec:
      initContainers:
        # Wait for traffic-api to be reachable before the dashboard starts
        - name: wait-for-api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for traffic-api:80..."
              until nc -z traffic-api 80; do
                echo "traffic-api not ready, sleeping 2s"
                sleep 2
              done
              echo "traffic-api is ready"
      containers:
        - name: traffic-dashboard
          image: "{{ .Values.global.imageRegistry }}{{ .Values.trafficDashboard.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.trafficDashboard.port }}
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://{{ .Values.trafficApi.ingress.host }}"
            - name: NEXT_PUBLIC_WS_URL
              value: "ws://{{ .Values.trafficApi.ingress.host }}"
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.trafficDashboard.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.trafficDashboard.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml .Values.trafficDashboard.resources | nindent 12 }}
