apiVersion: v1
kind: Service
metadata:
  name: traffic-dashboard
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "traffic-dashboard") .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "trafficOS.selectorLabels" (merge (dict "component" "traffic-dashboard") .) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.trafficDashboard.port }}
      protocol: TCP
