apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-simulator
  namespace: {{ .Values.global.namespace | default "trafficOS" }}
  labels:
    {{- include "trafficOS.labels" (merge (dict "component" "traffic-simulator") .) | nindent 4 }}
spec:
  replicas: {{ .Values.trafficSimulator.replicaCount }}
  selector:
    matchLabels:
      {{- include "trafficOS.selectorLabels" (merge (dict "component" "traffic-simulator") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trafficOS.selectorLabels" (merge (dict "component" "traffic-simulator") .) | nindent 8 }}
    spec:
      initContainers:
        # Wait for Kafka broker before starting to produce events
        - name: wait-for-kafka
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for kafka:9092..."
              until nc -z kafka 9092; do
                echo "kafka not ready, sleeping 2s"
                sleep 2
              done
              echo "kafka is ready"
        # Wait for Schema Registry before registering Avro schemas
        - name: wait-for-schema-registry
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for schema-registry:8082..."
              until nc -z schema-registry 8082; do
                echo "schema-registry not ready, sleeping 2s"
                sleep 2
              done
              echo "schema-registry is ready"
        # Wait for ClickHouse HTTP endpoint before inserting enrichment data
        - name: wait-for-clickhouse
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for clickhouse:8123..."
              until nc -z clickhouse 8123; do
                echo "clickhouse not ready, sleeping 2s"
                sleep 2
              done
              echo "clickhouse is ready"
      containers:
        - name: traffic-simulator
          image: "{{ .Values.global.imageRegistry }}{{ .Values.trafficSimulator.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: trafficOS-config
          env:
            - name: KAFKA_TOPIC
              value: {{ .Values.trafficSimulator.env.KAFKA_TOPIC | quote }}
            - name: GENERATOR_INTERVAL
              value: {{ .Values.trafficSimulator.env.GENERATOR_INTERVAL | quote }}
            - name: CLICKHOUSE_URL
              value: "http://clickhouse:8123"
          resources:
            {{- toYaml .Values.trafficSimulator.resources | nindent 12 }}
