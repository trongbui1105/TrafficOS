# Default values for trafficOS Helm chart.
# Override with values-dev.yaml for local kind cluster or values-prod.yaml for production.

global:
  imageRegistry: ""           # e.g. "ghcr.io/myorg/" — trailing slash included
  imagePullPolicy: IfNotPresent
  namespace: trafficOS

# ─── Infrastructure ────────────────────────────────────────────────────────────

kafka:
  image: apache/kafka:3.7.0
  storage: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

schemaRegistry:
  image: confluentinc/cp-schema-registry:7.6.0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

clickhouse:
  image: clickhouse/clickhouse-server:latest
  storage: 5Gi
  # max_memory_usage in bytes (2 GiB default)
  maxMemory: 2147483648
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 3Gi

redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ─── Application services ───────────────────────────────────────────────────────

trafficSimulator:
  image: traffic-simulator:latest
  replicaCount: 1
  env:
    KAFKA_TOPIC: traffic.raw
    GENERATOR_INTERVAL: "5s"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

trafficStreamProcessor:
  image: traffic-stream-processor:latest
  replicaCount: 1
  port: 8090
  env:
    KAFKA_INPUT_TOPIC: traffic.raw
    KAFKA_OUTPUT_TOPIC: traffic.analyzed
    WINDOW_SIZE_SECONDS: "30"
    JAVA_OPTS: "-Xmx256m"
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 768Mi

trafficApi:
  image: traffic-api:latest
  replicaCount: 2
  port: 8080
  env:
    KAFKA_ANALYZED_TOPIC: traffic.analyzed
    KAFKA_ALERTS_TOPIC: traffic.alerts
    JAVA_OPTS: "-Xmx256m"
  ingress:
    enabled: true
    host: api.trafficOS.local
    ingressClassName: nginx
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

trafficAlertEngine:
  image: traffic-alert-engine:latest
  replicaCount: 1
  port: 8091
  env:
    KAFKA_INPUT_TOPIC: traffic.analyzed
    KAFKA_OUTPUT_TOPIC: traffic.alerts
    JAVA_OPTS: "-Xmx256m"
  # Optional webhook URL for external alert delivery (e.g. Slack, PagerDuty)
  webhookUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 300m
      memory: 768Mi

trafficPredictor:
  image: traffic-predictor:latest
  replicaCount: 1
  port: 8000
  # How often (seconds) the model is retrained from ClickHouse history
  retrainInterval: 300
  # How often (seconds) predictions are refreshed and written to ClickHouse
  refreshInterval: 60
  # How often (seconds) the in-memory model state is persisted to disk
  persistInterval: 600
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

trafficDashboard:
  image: traffic-dashboard:latest
  replicaCount: 1
  port: 3000
  ingress:
    enabled: true
    host: trafficOS.local
    ingressClassName: nginx
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
