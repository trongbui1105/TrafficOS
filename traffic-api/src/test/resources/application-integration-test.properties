# -----------------------------------------------------------------------
# Integration-test Spring profile
#
# Goals:
#   • Real Redis via Testcontainers (host/port injected by @DynamicPropertySource)
#   • Kafka: listener auto-startup disabled so no broker connection is required
#   • ClickHouse: DataSource auto-config excluded; repos are @MockBean'd
#   • Predictor: URL points to a non-existent address (endpoints not tested)
# -----------------------------------------------------------------------

# Exclude JDBC DataSource auto-config — ClickHouse repos are @MockBean'd
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# Kafka — point to a dummy broker; no listeners start because AnalyzedEventConsumer
# is @MockBean'd (Spring Kafka won't register its @KafkaListener on the mock).
spring.kafka.bootstrap-servers=localhost:19999
spring.kafka.listener.auto-startup=false

# Redis host/port are overridden per-test via @DynamicPropertySource
# (defaults here are placeholders; Testcontainers values take precedence)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Predictor service — not called by any tested endpoint
traffic.predictor.url=http://localhost:19998
