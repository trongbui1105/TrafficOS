sonar.projectKey=traffic-simulator
sonar.projectName=traffic-simulator

sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/bin/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage produced by: go test ./... -coverprofile=coverage.out -covermode=atomic
sonar.go.coverage.reportPaths=coverage.out

sonar.sourceEncoding=UTF-8
