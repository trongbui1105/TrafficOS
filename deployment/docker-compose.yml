version: "3.9"

# Explicit project name so Docker always uses the same volume/network prefix
# regardless of which directory `docker compose` is invoked from.
# Matches the existing "deployment_*" volumes/networks already on disk.
name: deployment

services:

  # ── API Gateway (Traefik) ─────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    platform: linux/arm64
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--accesslog=true"
      - "--log.level=INFO"
    ports:
      - "80:80"         # All HTTP traffic
      - "8888:8080"     # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # ── Message broker ────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    platform: linux/arm64
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: x2aF8METT5WDUWRFKcEPlQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Limit JVM heap to keep Kafka from consuming all available RAM
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    mem_limit: 700m
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    platform: linux/arm64
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx128m -Xms64m"
    mem_limit: 256m

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    platform: linux/arm64
    container_name: kafka-ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      JAVA_OPTS: "-Xmx256m -Xms128m"
    mem_limit: 384m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kafka-ui.rule=PathPrefix(`/kafka`)"
      - "traefik.http.routers.kafka-ui.entrypoints=web"
      - "traefik.http.services.kafka-ui.loadbalancer.server.port=8080"

  # ── Storage ───────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    platform: linux/arm64
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/users.d/allow-default-user.xml:/etc/clickhouse-server/users.d/allow-default-user.xml:ro
      - ./clickhouse/config.d/memory-limits.xml:/etc/clickhouse-server/config.d/memory-limits.xml:ro
      - ./clickhouse/config.d/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
    mem_limit: 3g           # 6 GB Docker VM — give ClickHouse 3 GB hard cap
    mem_reservation: 1g     # soft reservation for scheduling
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped  # auto-recover if Docker OOM-kills the process

  redis:
    image: redis:7
    platform: linux/arm64
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO — S3-compatible object storage for raw event archival
  minio:
    image: minio/minio:latest
    platform: linux/arm64
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"    # S3 API
      - "9001:9001"    # MinIO Console UI
    environment:
      MINIO_ROOT_USER: trafficadmin
      MINIO_ROOT_PASSWORD: trafficadmin123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Application services ──────────────────────────────────────────────────
  traffic-simulator:
    build:
      context: ../traffic-simulator
      dockerfile: Dockerfile
    container_name: traffic-simulator
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: traffic.raw
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CLICKHOUSE_URL: http://clickhouse:8123
      GENERATOR_INTERVAL: 5s
      WEATHER_INTERVAL: 30s
      INCIDENT_INTERVAL: 20s
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: trafficadmin
      MINIO_SECRET_KEY: trafficadmin123
    restart: unless-stopped

  traffic-stream-processor:
    build:
      context: ../traffic-stream-processor
      dockerfile: Dockerfile
    container_name: traffic-stream-processor
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_INPUT_TOPIC: traffic.raw
      KAFKA_OUTPUT_TOPIC: traffic.analyzed
      WINDOW_SIZE_SECONDS: 30
      CLICKHOUSE_URL: jdbc:ch://clickhouse:8123/default
    ports:
      - "8090:8090"
    restart: unless-stopped

  traffic-api:
    build:
      context: ../traffic-api
      dockerfile: Dockerfile
    container_name: traffic-api
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_ANALYZED_TOPIC: traffic.analyzed
      KAFKA_ALERTS_TOPIC: traffic.alerts
      REDIS_HOST: redis
      CLICKHOUSE_URL: jdbc:ch://clickhouse:8123/default
      PREDICTOR_URL: http://traffic-predictor:8000
    ports:
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`) || PathPrefix(`/ws`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.average=200"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.api.middlewares=api-ratelimit"
    restart: unless-stopped

  traffic-alert-engine:
    build:
      context: ../traffic-alert-engine
      dockerfile: Dockerfile
    container_name: traffic-alert-engine
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_INPUT_TOPIC: traffic.analyzed
      KAFKA_OUTPUT_TOPIC: traffic.alerts
      CLICKHOUSE_URL: jdbc:ch://clickhouse:8123/default
      # Set to your Slack/Discord/Teams webhook URL to enable notifications
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SEVERITY: HIGH   # only notify for HIGH alerts
    ports:
      - "8091:8091"
    restart: unless-stopped

  # ML prediction service — Python FastAPI + scikit-learn
  traffic-predictor:
    build:
      context: ../traffic-predictor
      dockerfile: Dockerfile
    container_name: traffic-predictor
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RETRAIN_INTERVAL: 300
      REFRESH_INTERVAL: 10
      PERSIST_INTERVAL: 60
    ports:
      - "8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.predictor.rule=PathPrefix(`/predict`) || PathPrefix(`/anomalies`)"
      - "traefik.http.routers.predictor.entrypoints=web"
      - "traefik.http.services.predictor.loadbalancer.server.port=8000"
    restart: unless-stopped

  traffic-dashboard:
    build:
      context: ../traffic-dashboard
      dockerfile: Dockerfile
    container_name: traffic-dashboard
    depends_on:
      - traffic-api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
      NEXT_PUBLIC_PREDICTOR_URL: http://localhost:8000
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.services.dashboard.loadbalancer.server.port=3000"
    restart: unless-stopped

  # ── Observability ─────────────────────────────────────────────────────────
  # Loki — log aggregation backend
  loki:
    image: grafana/loki:3.0.0
    platform: linux/arm64
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  # Promtail — log collector (ships container logs → Loki)
  promtail:
    image: grafana/promtail:3.0.0
    platform: linux/arm64
    container_name: promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    platform: linux/arm64
    container_name: otel-collector
    volumes:
      - ./observability/otel-collector.yml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:latest
    platform: linux/arm64
    container_name: prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    platform: linux/arm64
    container_name: grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "lokiLive"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro

  jaeger:
    image: jaegertracing/all-in-one:latest
    platform: linux/arm64
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4319:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # Apache Superset — BI dashboards over ClickHouse
  superset:
    image: apache/superset:latest
    platform: linux/arm64
    container_name: superset
    depends_on:
      - clickhouse
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "trafficOS-superset-secret-2024"
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset-data:/app/superset_home
      - ./observability/superset-init.sh:/app/docker/docker-init.sh:ro
    restart: unless-stopped

volumes:
  clickhouse-data:
  grafana-data:
  minio-data:
  loki-data:
  superset-data:
