server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── Docker container logs ─────────────────────────────────────────────────
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # Parse Docker JSON log wrapper
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
          source: ""

      - json:
          expressions:
            tag:
          source: attrs

      # Extract container name from attrs.tag (format: container_name/container_id)
      - regex:
          expression: '^(?P<container_name>(?:[^|]*[^|]))$'
          source: tag

      - timestamp:
          format: RFC3339Nano
          source: time

      - labels:
          stream:
          container_name:

      - output:
          source: output

  # ── System logs ───────────────────────────────────────────────────────────
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog

  # ── Specific service log enrichment via relabeling ────────────────────────
  - job_name: traffic-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: traffic
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            attrs:

      - json:
          expressions:
            tag:
          source: attrs

      - regex:
          expression: '^(?P<container>(traffic-simulator|traffic-stream-processor|traffic-api|traffic-alert-engine|traffic-predictor|traffic-dashboard))'
          source: tag

      - drop:
          source: container
          value: ""

      - labels:
          container:

      - json:
          expressions:
            level:
            msg:
            time:
          source: log

      - labels:
          level:

      - timestamp:
          format: RFC3339
          source: time

      - output:
          source: log
