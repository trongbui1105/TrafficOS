# OpenTelemetry Collector configuration
# Receives traces and metrics from all services, forwards to Jaeger and Prometheus.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317    # gRPC — used by Java Spring Boot OTel SDK
      http:
        endpoint: 0.0.0.0:4318    # HTTP — used by Go OTel SDK

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Add resource attributes to every span/metric
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert

exporters:
  # Traces → Jaeger
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics → Prometheus (scrape endpoint exposed on :8889)
  prometheus:
    endpoint: 0.0.0.0:8889

  # Debug logging (remove in production)
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [batch, resource]
      exporters:  [otlp/jaeger, debug]

    metrics:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [prometheus]
