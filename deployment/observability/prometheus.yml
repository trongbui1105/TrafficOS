global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot Actuator Prometheus endpoints
  - job_name: traffic-stream-processor
    static_configs:
      - targets: ['traffic-stream-processor:8090']
    metrics_path: /actuator/prometheus

  - job_name: traffic-api
    static_configs:
      - targets: ['traffic-api:8080']
    metrics_path: /actuator/prometheus

  - job_name: traffic-alert-engine
    static_configs:
      - targets: ['traffic-alert-engine:8091']
    metrics_path: /actuator/prometheus

  # OTel Collector self-metrics and forwarded metrics
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  # Python traffic-predictor (FastAPI + prometheus-fastapi-instrumentator)
  - job_name: traffic-predictor
    static_configs:
      - targets: ['traffic-predictor:8000']
    metrics_path: /metrics
