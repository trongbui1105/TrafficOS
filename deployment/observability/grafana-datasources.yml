apiVersion: 1

datasources:
  # ── Prometheus — metrics ──────────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: POST

  # ── Loki — log aggregation ────────────────────────────────────────────────
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 5000
      derivedFields:
        # Link Loki log lines that contain a traceId to Jaeger
        - datasourceUid: jaeger
          matcherRegex: '"traceId":"(\w+)"'
          name: TraceID
          url: "$${__value.raw}"

  # ── Jaeger — distributed tracing ─────────────────────────────────────────
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: false

  # ── ClickHouse — direct analytical queries ────────────────────────────────
  # Requires the Grafana ClickHouse plugin; install via:
  #   grafana-cli plugins install grafana-clickhouse-datasource
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      server: clickhouse
      port: 9000
      username: default
      defaultDatabase: default
      protocol: native
