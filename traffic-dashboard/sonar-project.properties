sonar.projectKey=traffic-dashboard
sonar.projectName=traffic-dashboard

sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/.next/**,**/playwright-report/**,**/test-results/**

sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/e2e/**/*.ts

# Coverage produced by: npm run test:coverage  (vitest --coverage → coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
