sonar.projectKey=traffic-predictor
sonar.projectName=traffic-predictor

sonar.sources=.
sonar.exclusions=tests/**,**/__pycache__/**,**/*.pyc,.venv/**,venv/**

sonar.tests=tests
sonar.test.inclusions=tests/test_*.py

# Coverage produced by: pytest tests/ --cov=. --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11

sonar.sourceEncoding=UTF-8
